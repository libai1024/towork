name: 问题反馈
description: 报告可复现的问题
body:
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 应用版本、设备型号、系统版本和输入方式
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、实际结果与期望结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图与已脱敏日志
      description: 提交前移除 Key、个人内容和私有路径
