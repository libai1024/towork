name: towork
description: "ToWork: a conversation-driven work management application."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.11+16

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  lucide_icons_flutter: ^3.1.20
  fl_chart: ^0.69.2
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  dio: ^5.11.1
  drift: ^2.35.0
  sqlite3: ^3.6.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  cupertino_icons: ^1.0.9
  characters: ^1.4.1
  crypto: ^3.0.7
  flutter_patcher: 1.0.0+1
  connectivity_plus: ^7.3.1
  timezone: ^0.11.1
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  file_selector: ^1.1.0
  image_picker: ^1.2.3
  flutter_svg: ^2.2.0
  sherpa_onnx: ^1.13.8
  record: ^7.1.1
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  lunar: ^1.7.9

dev_dependencies:
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:

  uses-material-design: true
  assets:
    - website/changelog.json
    - assets/brands/
    - assets/membership/
    - assets/asr/sense-voice-int8/
    - assets/asr/silero-vad/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

